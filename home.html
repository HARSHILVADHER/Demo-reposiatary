<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
</head>
<body style="font-family: Arial, sans-serif; background:#e7ffec; height:100vh; margin:0; display:flex; justify-content:center; align-items:center; flex-direction:column;">

  <h1 style="color:#2b7a0b;">Welcome to Home Page</h1>

  <div style="background:white; padding:20px; border-radius:10px; width:320px; box-shadow:0 0 8px rgba(0,0,0,0.2); margin-top:20px;">
    <h3 style="text-align:center;">Submit Details</h3>

    <form>
      <input type="text" placeholder="Full Name" required
        style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #aaa; border-radius:5px;">

      <input type="text" placeholder="Message" required
        style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #aaa; border-radius:5px;">

      <button type="submit"
        style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">
        Submit
      </button>
    </form>
  </div>

</body>
</html>
