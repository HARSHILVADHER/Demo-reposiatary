<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh;">

  <div style="background:white; padding:30px; border-radius:10px; width:300px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.2);">
    <h2 style="margin-bottom:20px;">Login</h2>

    <form onsubmit="return goHome()">
      <input type="email" placeholder="Email" required
        style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;"><br>

      <input type="password" placeholder="Password" required
        style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc; border-radius:5px;"><br>

      <button type="submit"
        style="width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer;">
        Login
      </button>
    </form>
  </div>

  <script>
    function goHome() {
      window.location.href = "home.html";
      return false;
    }
  </script>

</body>
</html>
